              - paragraph [ref=f20e98]: Senior Mobile Engineer
              - paragraph [ref=f20e99]
              - paragraph [ref=f20e100]: Accendra Health is seeking a highly skilled and motivated Mobile Engineer, to join our dynamic development team. In this role, you will be responsible for designing, developing, and maintaining complex mobile applications using modern JS and Native frameworks and Digital Experience Platforms. You will leverage your deep understanding of multiple form factors and mobile platforms to deliver exceptional user experiences and robust, scalable solutions. You will also play a key role in driving technical best practices and contributing to architectural decisions.
              - paragraph [ref=f20e101]: "Responsibilities:"
              - list [ref=f20e102]:
                - listitem [ref=f20e103]
                - listitem [ref=f20e111]
              - paragraph [ref=f20e117]
              - list [ref=f20e118]:
                - listitem [ref=f20e119]
                - listitem [ref=f20e126]
              - paragraph [ref=f20e134]: "Qualifications:"
              - list [ref=f20e135]:
                - listitem [ref=f20e136]: Bachelor’s degree in computer science, Software Engineering, or a related field.
                - listitem [ref=f20e137]: 7+ years of professional experience in mobile development.
                - listitem [ref=f20e138]: Proficiency in Rest API, authentication and GraphQL.
                - listitem [ref=f20e139]: Experience with front-end technologies and Server-side rendering (HTML, CSS, JavaScript, React, React Native, NextJS, Tailwind).
                - listitem [ref=f20e140]: Experience with mobile platforms (iOS, Android).
                - listitem [ref=f20e141]: Experience with CI/CD pipelines and DevOps practices.
                - listitem [ref=f20e142]: Experience with mobile development building native or hybrid apps.
              - paragraph [ref=f20e143]
              - paragraph [ref=f20e144]: "Preferred Qualifications:"
              - list [ref=f20e145]:
                - listitem [ref=f20e146]: Experience with a Digital experience/CMS platform, Digital Asset Management (DAM)
                - listitem [ref=f20e147]: Experience with headless architecture and GraphQL
                - listitem [ref=f20e148]: Server-side rendering with NextJS/Vercel
              - paragraph [ref=f20e149]: Work Location
              - paragraph [ref=f20e150]: Pune, India – Hybrid preferred, Remote possible for the right candidate
              - paragraph [ref=f20e151]
